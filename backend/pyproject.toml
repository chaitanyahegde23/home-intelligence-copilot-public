[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-intelligence-copilot-backend"
version = "0.1.0"
description = "Backend API for Home Intelligence Copilot"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<1.19",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "ocrmypdf>=17.10,<18",
    "openai>=2.0,<3",
    "argon2-cffi>=25.1,<26",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6.15,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
exclude = ["alembic"]
